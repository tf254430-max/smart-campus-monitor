<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Campus Monitor - Live Dashboard</title>
<!-- MQTT over secure WebSockets, same broker the ESP32 publishes to -->
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<style>
  :root { --bg:#0f172a; --card:#111c33; --line:#22314f; --txt:#e2e8f0; --mute:#94a3b8;
          --ok:#16a34a; --busy:#f59e0b; --no:#dc2626; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Segoe UI',Arial,sans-serif; background:var(--bg); color:var(--txt); }
  header { padding:16px 24px; border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:20px; margin:0; }
  header .sub { color:var(--mute); font-size:13px; }
  .pill { margin-left:auto; padding:6px 12px; border-radius:999px; font-size:13px; background:#1e293b; }
  .pill.on { background:#14532d; } .pill.off { background:#7f1d1d; }
  main { padding:20px 24px; display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .card h2 { margin:0 0 6px; font-size:16px; }
  .status { font-size:26px; font-weight:800; margin:6px 0 2px; }
  .AVAILABLE { color:var(--ok); } .CROWDED { color:var(--busy); } .UNAVAILABLE { color:var(--no); }
  .reason { color:var(--mute); font-size:13px; min-height:18px; }
  table { width:100%; border-collapse:collapse; margin-top:10px; font-size:13px; }
  td { padding:4px 0; border-bottom:1px dashed var(--line); } td:last-child { text-align:right; }
  .warn { color:#fca5a5; font-size:12px; margin-top:6px; min-height:16px; }
  .meta { color:var(--mute); font-size:12px; margin-top:8px; }
  #log { grid-column:1/-1; }
  .badge { font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; margin-left:8px; vertical-align:middle; }
  .badge.live { background:#14532d; color:#bbf7d0; } .badge.rec { background:#334155; color:#cbd5e1; }
  #note { margin:16px 24px 0; padding:12px 16px; border-radius:10px; background:#1e293b; border:1px solid var(--line); font-size:14px; line-height:1.5; display:none; }
  #note a { color:#7dd3fc; }
  #log pre { margin:0; max-height:260px; overflow:auto; font-size:12px; color:#cbd5e1; white-space:pre-wrap; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Smart Campus Resource &amp; Accessibility Monitor</h1>
    <div class="sub">Cavendish University Uganda · BDA 2201 CAT 2 · Tinka Fahad (254430) · MQTT broker.hivemq.com</div>
  </div>
  <span id="conn" class="pill">connecting…</span>
</header>
<div id="note"></div>
<main>
  <section class="card" id="card-library"><h2>📚 Library Zone</h2><div class="status">waiting…</div><div class="reason"></div><table></table><div class="warn"></div><div class="meta"></div></section>
  <section class="card" id="card-lab"><h2>💻 Computer Lab</h2><div class="status">waiting…</div><div class="reason"></div><table></table><div class="warn"></div><div class="meta"></div></section>
  <section class="card" id="card-pod"><h2>♿ Accessible Study Pod</h2><div class="status">waiting…</div><div class="reason"></div><table></table><div class="warn"></div><div class="meta"></div></section>
  <section class="card" id="log"><h2>Message log (newest first)</h2><pre></pre></section>
</main>
<script>
  const BASE = 'cavendish/bda2201/254430/campus/';
  const conn = document.getElementById('conn');
  const logEl = document.querySelector('#log pre');
  const note = document.getElementById('note');
  const WOKWI = 'https://wokwi.com/projects/480950410010713089';

  // the public broker does not keep retained messages for long, so when the
  // simulation is not running there is nothing to receive. in that case the page
  // shows the last real messages the node sent (copied from the broker on
  // 21 nov 2026, wokwi project above) so the cards are never empty.
  // they are marked "recorded" and get replaced as soon as a live one arrives.
  const LAST = {"library":{"at":"2026-11-21 00:25","msg":{"node":"cuu-main-block-01","facility":"Library Zone","facility_key":"library","status":"AVAILABLE","reason":"free and comfortable","low_confidence":false,"uptime_s":13,"telemetry":{"distance_cm":253.5,"temp_c":24,"humidity_pct":55,"light_lux":411,"motion":false,"pir_ratio_30s":0},"edge_ai":{"occupancy_score":0.04,"comfort_index":1,"spike_detected":false},"sensor_faults":[],"actuators":{"rgb":"GREEN","servo_deg":0,"buzzer":"AVAILABLE"},"network":{"rssi_dbm":-83,"last_http_code":200,"last_http_ms":1332}}},"lab":{"at":"2026-11-21 00:26","msg":{"node":"cuu-main-block-01","facility":"Computer Lab","facility_key":"lab","status":"UNAVAILABLE","reason":"too hot to use","low_confidence":false,"uptime_s":31,"telemetry":{"distance_cm":253.6,"temp_c":34,"humidity_pct":55,"light_lux":411,"motion":false,"pir_ratio_30s":0},"edge_ai":{"occupancy_score":0.09,"comfort_index":0,"spike_detected":false},"sensor_faults":[],"actuators":{"rgb":"RED","servo_deg":180,"buzzer":"UNAVAILABLE"},"network":{"rssi_dbm":-89,"last_http_code":200,"last_http_ms":1569}}},"pod":{"at":"2026-11-21 00:26","msg":{"node":"cuu-main-block-01","facility":"Accessible Study Pod","facility_key":"pod","status":"CROWDED","reason":"pod in use","low_confidence":false,"uptime_s":20,"telemetry":{"distance_cm":253.5,"temp_c":24,"humidity_pct":55,"light_lux":411,"motion":true,"pir_ratio_30s":0.25},"edge_ai":{"occupancy_score":0.07,"comfort_index":1,"spike_detected":false},"sensor_faults":[],"actuators":{"rgb":"AMBER","servo_deg":90,"buzzer":"CROWDED"},"network":{"rssi_dbm":-92,"last_http_code":200,"last_http_ms":1606}}}};
  const live = {}, kept = {};

  const fmt = (v, unit) => (v === null || v === undefined) ? '<span style="color:#fca5a5">sensor offline</span>' : v + (unit || '');

  // label: null for a live message, otherwise a short note on where it came from
  function render(key, p, label) {
    const card = document.getElementById('card-' + key);
    if (!card) return;
    const h2 = card.querySelector('h2');
    const old = h2.querySelector('.badge'); if (old) old.remove();
    h2.insertAdjacentHTML('beforeend', label ? '<span class="badge rec">RECORDED</span>' : '<span class="badge live">LIVE</span>');
    const st = card.querySelector('.status');
    st.textContent = p.status + (p.low_confidence ? ' *' : '');
    st.className = 'status ' + p.status;
    card.querySelector('.reason').textContent = p.reason || '';
    const t = p.telemetry || {}, ai = p.edge_ai || {}, a = p.actuators || {}, n = p.network || {};
    card.querySelector('table').innerHTML =
      `<tr><td>Distance (seat row / ramp)</td><td>${fmt(t.distance_cm, ' cm')}</td></tr>` +
      `<tr><td>Temperature / humidity</td><td>${fmt(t.temp_c, ' °C')} / ${fmt(t.humidity_pct, ' %')}</td></tr>` +
      `<tr><td>Light</td><td>${fmt(t.light_lux, ' lux')}</td></tr>` +
      `<tr><td>Motion now / last 30 s</td><td>${t.motion ? 'yes' : 'no'} / ${Math.round((t.pir_ratio_30s || 0) * 100)}%</td></tr>` +
      `<tr><td>Edge AI occupancy score</td><td>${Math.round((ai.occupancy_score || 0) * 100)}%</td></tr>` +
      `<tr><td>Comfort index</td><td>${ai.comfort_index === null || ai.comfort_index === undefined ? 'n/a' : ai.comfort_index}</td></tr>` +
      `<tr><td>Actuators</td><td>LED ${a.rgb} · servo ${a.servo_deg}° · buzzer ${a.buzzer}</td></tr>`;
    const faults = p.sensor_faults || [];
    card.querySelector('.warn').textContent =
      (faults.length ? '⚠ Sensor fault: ' + faults.join(', ') + ' — decision made with the remaining sensors. ' : '') +
      (ai.spike_detected ? '⚠ Sudden spike ignored by the anomaly filter.' : '');
    card.querySelector('.meta').textContent =
      (label || `Received ${new Date().toLocaleTimeString()}`) + ` · uptime ${p.uptime_s}s · Wi-Fi RSSI ${n.rssi_dbm} dBm · last HTTP ${n.last_http_code || '-'} in ${n.last_http_ms || '-'} ms · node ${p.node}`;
  }

  function showRecorded() {
    for (const key in LAST) if (!live[key] && !kept[key]) render(key, LAST[key].msg, `Recorded ${LAST[key].at} (EAT)`);
    if (Object.keys(live).length) return;
    note.style.display = 'block';
    note.innerHTML = '<b>No live data right now.</b> The ESP32 only sends messages while the Wokwi simulation is running, ' +
      'so the cards marked RECORDED show the last real messages it sent. To watch it live, open the ' +
      `<a href="${WOKWI}" target="_blank" rel="noopener">Wokwi project</a> and press the green Start button. ` +
      'The cards switch to LIVE about a minute later (the free Wokwi plan queues the build first).';
  }
  // give a running simulation a few seconds to answer before falling back
  setTimeout(showRecorded, 6000);

  // some networks block the mqtt library or websockets; the recorded cards still show
  if (typeof mqtt === 'undefined') {
    conn.textContent = 'MQTT blocked on this network'; conn.className = 'pill off';
    throw new Error('mqtt library did not load');
  }
  const client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt', {
    clientId: 'cuu-dashboard-' + Math.random().toString(16).slice(2, 8), reconnectPeriod: 3000,
  });
  client.on('connect', () => {
    conn.textContent = 'MQTT connected'; conn.className = 'pill on';
    client.subscribe(BASE + '#', { qos: 0 });
  });
  client.on('close', () => { conn.textContent = 'MQTT disconnected – retrying'; conn.className = 'pill off'; });
  client.on('message', (topic, buf, packet) => {
    let p; try { p = JSON.parse(buf.toString()); } catch (e) { return; }
    const key = topic.substring(BASE.length);
    // a retained message is the broker replaying an old one, not the node talking now
    if (packet && packet.retain) {
      if (!live[key]) { kept[key] = true; render(key, p, 'Last message kept by the broker (sent earlier)'); }
      logEl.textContent = `${new Date().toLocaleTimeString()}  ${topic}  ${p.status}  (kept by broker, sent earlier)` + '\n' + logEl.textContent;
      return;
    }
    live[key] = true;
    render(key, p);
    note.style.display = 'block';
    note.innerHTML = '<b>Live:</b> receiving messages from the ESP32 simulation.' +
      (Object.keys(LAST).some(k => !live[k]) ? ' Cards still marked RECORDED have not sent a new message yet (press the button for that facility in Wokwi).' : '');
    const line = `${new Date().toLocaleTimeString()}  ${topic}  ${p.status}  (${p.reason})  ${buf.length} bytes`;
    logEl.textContent = line + '\n' + logEl.textContent;
  });
</script>
</body>
</html>
